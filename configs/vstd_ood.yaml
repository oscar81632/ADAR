dataset_name: vstd_ood
seed: 303

image:
  size: 224
  grid_size: 14
  background: [248, 248, 246]
  line_width: 3

classes:
  colors:
    red: [220, 62, 62]
    blue: [54, 105, 210]
    green: [56, 155, 92]
    yellow: [226, 178, 54]
  shapes:
    - circle
    - square

splits:
  train: 10000
  val: 2000
  test: 3000

factors:
  path_lengths: [8, 12, 16, 20]
  distractor_ratios: [0.15, 0.25]

split_factors:
  val:
    path_lengths: [12, 16, 20, 24]
    distractor_ratios: [0.25, 0.4]
  test:
    path_lengths: [24, 32, 40, 48]
    distractor_ratios: [0.4, 0.55, 0.65]

generation:
  min_turns: 2
  max_attempts_per_sample: 1000
  draw_path_trace: false
  start_marker: cell_outline
  distractor_shapes: true

split_generation:
  val:
    min_turns: 4
  test:
    min_turns: 6
