dataset_name: vstd_hard
seed: 303

image:
  size: 224
  grid_size: 14
  background: [248, 248, 246]
  line_width: 3

classes:
  colors:
    red: [220, 62, 62]
    blue: [54, 105, 210]
    green: [56, 155, 92]
    yellow: [226, 178, 54]
  shapes:
    - circle
    - square

splits:
  train: 20000
  val: 3000
  test: 5000

factors:
  path_lengths: [24, 32, 40, 48]
  distractor_ratios: [0.25, 0.4, 0.55]

generation:
  min_turns: 5
  max_attempts_per_sample: 1000
  draw_path_trace: false
  start_marker: cell_outline
  distractor_shapes: true
